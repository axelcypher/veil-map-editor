# Windows installers (MSI and NSIS). Runs by hand, or on a push to main when the version in
# package.json has no release yet.
name: Windows-Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version:
    name: Version prüfen
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        name: Version lesen und prüfen, ob es das Release schon gibt
        # package.json is the only place the version is set; tauri.conf.json reads it from there
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(jq -r .version package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # a push builds while the release for this version lacks the installer, so a failed run
          # is made up for by the next push; a manual run always builds, without a release
          if [ "${{ github.event_name }}" = "push" ]; then
            assets=$(gh release view "v$version" --json assets --jq '.assets[].name' 2>/dev/null || true)
            if echo "$assets" | grep -q '\.msi$'; then echo "release=skip" >> "$GITHUB_OUTPUT"; else echo "release=yes" >> "$GITHUB_OUTPUT"; fi
          else
            echo "release=no" >> "$GITHUB_OUTPUT"
          fi
          echo "Version $version, Ereignis ${{ github.event_name }}"

  build:
    name: Windows bauen
    needs: version
    if: needs.version.outputs.release != 'skip'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # With the update key (secrets TAURI_SIGNING_PRIVATE_KEY and _PASSWORD, variable
      # TAURI_UPDATER_PUBKEY) the build signs its installers and the app can update itself.
      - name: Tauri-Build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$UPDATER_PUBKEY" ]; then
            jq -n --arg key "$UPDATER_PUBKEY" --arg url "https://github.com/$REPO/releases/latest/download/latest.json" \
              '{bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: $key, endpoints: [$url], windows: {installMode: "passive"}}}}' > updater.json
            npx tauri build --config updater.json
          else
            echo "::warning::Kein Update-Schlüssel hinterlegt – dieser Build kann sich nicht selbst aktualisieren und verweist auf die Release-Seite."
            npx tauri build
          fi
      - name: Installer einsammeln
        shell: bash
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p out
          bundle=src-tauri/target/release/bundle
          # GitHub turns spaces in asset names into dots; do it here so latest.json names them right
          for f in "$bundle"/msi/*.msi "$bundle"/nsis/*.exe; do
            name=$(basename "$f")
            cp "$f" "out/${name// /.}"
          done
          # the update manifest the app asks for; only signed builds have the .sig files
          nsis_sig=$(ls "$bundle"/nsis/*.exe.sig 2>/dev/null | head -1)
          msi_sig=$(ls "$bundle"/msi/*.msi.sig 2>/dev/null | head -1)
          if [ -n "$nsis_sig" ] && [ -n "$msi_sig" ]; then
            base="https://github.com/$REPO/releases/download/v$VERSION"
            nsis=$(basename "${nsis_sig%.sig}"); nsis="${nsis// /.}"
            msi=$(basename "${msi_sig%.sig}"); msi="${msi// /.}"
            jq -n --arg version "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg nsis_url "$base/$nsis" --rawfile nsis_sig "$nsis_sig" \
              --arg msi_url "$base/$msi" --rawfile msi_sig "$msi_sig" \
              --arg notes "https://github.com/$REPO/releases/tag/v$VERSION" \
              '{version: $version, notes: $notes, pub_date: $date, platforms: {
                 "windows-x86_64": {signature: $nsis_sig, url: $nsis_url},
                 "windows-x86_64-nsis": {signature: $nsis_sig, url: $nsis_url},
                 "windows-x86_64-msi": {signature: $msi_sig, url: $msi_url}}}' > out/latest.json
          fi
          ls -la out
      - uses: actions/upload-artifact@v6
        with:
          name: veil-map-editor-${{ needs.version.outputs.version }}-windows
          path: out/*

  release:
    name: An das Release hängen
    needs: [version, build]
    if: needs.version.outputs.release == 'yes'
    runs-on: ubuntu-latest
    # the Windows and the Android workflow attach to the same release; one at a time, so it is
    # created only once
    concurrency:
      group: release-${{ needs.version.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: veil-map-editor-${{ needs.version.outputs.version }}-windows
          path: out
      - name: Release anlegen und Dateien hochladen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "VEIL Map Editor $TAG" --generate-notes
          gh release upload "$TAG" out/* --clobber
