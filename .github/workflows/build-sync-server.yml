# The sync server image, ghcr.io/axelcypher/sync-server:sha-<commit> and :latest, whenever its
# folder changes on main (or by hand).
name: Sync-Server-Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['sync-server/**', '.github/workflows/build-sync-server.yml']

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Image bauen und veröffentlichen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: sync-server
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/axelcypher/sync-server:sha-${{ github.sha }}
            ghcr.io/axelcypher/sync-server:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Sync store for the own apps: data per secret code
          cache-from: type=gha
          cache-to: type=gha,mode=max
