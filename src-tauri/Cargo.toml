[package]
name = "veil-map-editor"
version = "0.5.0"
description = "Supplement-Editor für die Weltkarte: Städte, Routen, Staaten und weitere Karteninhalte"
authors = ["Tobias"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "veil_map_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
image = { version = "0.25", default-features = false, features = ["png", "tiff", "jpeg", "webp", "rayon"] }
rayon = "1.10"
blake3 = "1.5"
webp = "0.3"
tauri-plugin-fs = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
percent-encoding = "2"

[profile.dev.package."*"]
opt-level = 3
